version: '3.8'

services:
  # 1. Database Service (NEW)
  db:
    image: postgres:15-alpine
    container_name: transformance_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=transformance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Python Backend Service
  backend:
    build: ./backend
    container_name: transformance_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/transformance
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

  # 3. React Frontend Service
  frontend:
    build: ./frontend
    container_name: transformance_ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data: