version: '3.8'

services:
  # Python Backend Service
  backend:
    build: ./backend
    container_name: transformance_api
    ports:
      - "8000:8000"
    volumes:
      # Sync local changes to container (Hot Reloading)
      - ./backend/src:/app/src
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1

  # React Frontend Service
  frontend:
    build: ./frontend
    container_name: transformance_ui
    ports:
      - "5173:5173"
    volumes:
      # Sync local changes, but ignore node_modules
      - ./frontend/src:/app/src
      - /app/node_modules
    depends_on:
      - backend
    environment:
      # Vite needs this to work correctly in Docker
      - CHOKIDAR_USEPOLLING=true
  #DB
  db:
    image: postgres:15-alpine
    container_name: transformance_db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=transformance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: